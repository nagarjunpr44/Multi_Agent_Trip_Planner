services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trip_planner
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp -d trip_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_DB_URL: postgresql+asyncpg://atp:atp@postgres:5432/trip_planner
      CHECKPOINT_URL: postgresql://atp:atp@postgres:5432/trip_planner
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
