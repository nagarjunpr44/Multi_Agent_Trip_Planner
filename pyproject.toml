[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "agentictripplanner"
version = "1.0.0"
description = "LangGraph trip planner agent that edits a validated Trip document"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langchain>=1.2",
    "langchain-core>=0.3",
    "langchain-openai>=1.1",
    "langchain-anthropic>=1.3",
    "fastapi>=0.134",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
]

[tool.hatch.build.targets.wheel]
packages = ["trip_planner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["trip_planner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
