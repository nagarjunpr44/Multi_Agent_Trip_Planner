[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "agentictripplanner"
version = "1.0.0"
description = "Production-grade LangGraph multi-agent Travel AI system"
requires-python = ">=3.11"
dependencies = [
    # LangGraph ecosystem
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langchain-openai>=1.1",
    "langchain-anthropic>=1.3",
    "langchain-core>=0.3",
    "langsmith>=0.2",

    # OpenAI + Anthropic SDKs
    "openai>=2.24",
    "anthropic>=0.40",

    # FastAPI ecosystem
    "fastapi>=0.134",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "websockets>=14.0",
    "python-multipart>=0.0.12",

    # Pydantic + settings
    "pydantic>=2.10",
    "pydantic-settings>=2.6",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",

    # Redis (asyncio support is built-in since redis 7.x)
    "redis>=7.0",

    # Vector store / embeddings
    "chromadb>=0.6",

    # External APIs
    "amadeus>=9.0",
    "tavily-python>=0.7",
    "httpx>=0.28",
    "geopy>=2.4",

    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",

    # Utilities
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "babel>=2.16",
    "reportlab>=4.2",
    "folium>=0.18",

    # Streamlit UI
    "streamlit>=1.42",
    "plotly>=5.24",

    # Alembic migrations
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "faker>=33.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
